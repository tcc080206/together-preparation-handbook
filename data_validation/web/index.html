<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>資料核對平台</title><link rel="stylesheet" href="/style.css"><body><aside><strong>資料核對平台</strong><label class="nav-filter"><input id="incomplete-only" type="checkbox">只顯示未全部核准</label><nav aria-label="資料分類"></nav><p id="nav-note" role="status"></p></aside><main><h1 id="title"></h1><p>確認本類重要欄位，整頁核對後一次儲存。</p><div class="toolbar"><span id="progress"></span><button id="all-correct" type="button" disabled>✅ 全部正確</button><small>本頁全部欄位（含篩選隱藏項目）；取代錯誤標記，儲存後生效。</small><label>顯示 <select id="filter"><option value="all">全部資料</option><option value="pending">含未核對欄位</option><option value="incorrect">含錯誤欄位</option></select></label></div><p id="scope"></p><div id="imports" aria-live="polite"></div><form id="page-form"><div id="records">載入中…</div><div class="actions"><button id="save" disabled>儲存本頁核對</button><button id="apply" type="button" disabled>🔄 套用修正</button><span id="message" role="status"></span><small>套用修正會更新本頁已儲存的資料；未核對欄位維持原值。</small></div></form><details id="history"><summary>修改紀錄</summary><div id="events"></div></details><footer>核對結果與修改歷史保留在本機，使用者核對不代表完整資格已確認。</footer></main><script src="/app.js"></script></body></html>
